name: Tax Deadline Reminders

on:
  schedule:
    # Once a day — tax deadline reminders are set days/weeks in advance, so
    # daily granularity is enough (unlike appointment reminders, which need
    # hourly checks against a specific time slot).
    - cron: "0 7 * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate secrets
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set. Add it under Settings → Environments → production → Secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID secret is not set."
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Trigger tax-deadline-notifier edge function
        run: |
          curl --fail-with-body -X POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/tax-deadline-notifier" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
