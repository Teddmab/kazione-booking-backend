name: Deploy — Edge Functions (master only)

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/deploy.py

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "❌ SUPABASE_DB_URL secret is not set."
            echo ""
            echo "The direct db.*.supabase.co host is IPv6-only and unreachable from GitHub"
            echo "Actions runners. Use the session-mode pooler URL (IPv4) instead."
            echo ""
            echo "How to get it:"
            echo "  Supabase Dashboard → Settings → Database → Connection string"
            echo "  → switch to 'Session mode' tab → copy the URI"
            echo ""
            echo "Format: postgresql://postgres.{ref}:{password}@{region}.pooler.supabase.com:5432/postgres"
            echo ""
            echo "Add it as SUPABASE_DB_URL in: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          supabase db push --db-url "${SUPABASE_DB_URL}"
