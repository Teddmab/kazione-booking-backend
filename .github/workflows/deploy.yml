name: Deploy — Edge Functions (master only)

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/deploy.py

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # db.*.supabase.co resolves to IPv6, which GitHub Actions runners can't reach.
          # Use the session-mode connection pooler (IPv4) instead — same password, no new secrets.
          # We derive the pooler hostname from the project region via the Management API.
          REGION=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['region'])")
          POOLER_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${SUPABASE_DB_PASSWORD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres"
          supabase db push --db-url "${POOLER_URL}"
